<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-label="Two video timelines. Cooking: short clips of the ingredients, a tip and the finished dish, pointing viewers to the full video. Comedy: one longer clip that keeps the setup and punchline together.">
<rect width="800" height="330" fill="#fff"/>
<text x="40" y="36" font-family="Manrope,Arial,sans-serif" font-size="17" font-weight="800" fill="#1b2433">Cooking video</text><rect x="40" y="50" width="720" height="34" rx="8" fill="#e6dccd"/><rect x="70" y="50" width="90" height="34" rx="8" fill="#0f6b6b"/><text x="115.0" y="106" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="14" font-weight="700" fill="#1b2433">Ingredients</text><rect x="330" y="50" width="80" height="34" rx="8" fill="#0f6b6b"/><text x="370.0" y="106" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="14" font-weight="700" fill="#1b2433">A tip</text><rect x="620" y="50" width="110" height="34" rx="8" fill="#0f6b6b"/><text x="675.0" y="106" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="14" font-weight="700" fill="#1b2433">Final dish</text><text x="40" y="134" font-family="Manrope,Arial,sans-serif" font-size="14" fill="#6b6457">Short teasers that make viewers want the full recipe</text>
<text x="40" y="186" font-family="Manrope,Arial,sans-serif" font-size="17" font-weight="800" fill="#1b2433">Comedy video</text><rect x="40" y="200" width="720" height="34" rx="8" fill="#e6dccd"/><rect x="250" y="200" width="260" height="34" rx="8" fill="#d9775a"/><text x="380.0" y="256" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="14" font-weight="700" fill="#1b2433">Setup to punchline</text><text x="40" y="284" font-family="Manrope,Arial,sans-serif" font-size="14" fill="#6b6457">One complete joke that works on its own</text>
</svg>